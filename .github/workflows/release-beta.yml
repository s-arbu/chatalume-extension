name: Prepare beta draft

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag matching package.json (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build extension
        run: bun run build
      - name: Check types and unit tests
        run: bunx tsc --noEmit && bun run test:unit
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check wallpaper behavior
        run: bun run test:browser
      - name: Package release zip
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          bun scripts/check-release.ts "$RELEASE_TAG"
          bun scripts/package-release.ts
      - name: Prepare draft GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/chatalume-v*.zip
            out/chatalume-v*.zip.sha256
          generate_release_notes: true
          prerelease: true
          draft: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
