<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatalume</title>
  <link rel="stylesheet" href="src/popup/popup.css">
</head>
<body class="toolbar">
  <main class="dashboard">
    <header><img class="brand-mark" src="logo.svg" alt=""><div><h1>Chatalume</h1><p>Your chat, your space.</p></div></header>
    <section class="section toolbar-context" aria-labelledby="providerName">
      <h2 id="providerName">Loading chat controls…</h2>
      <p id="contextNotice">Checking the active tab.</p>
      <div id="siteActions" class="toolbar-actions" hidden>
        <button type="button" id="sitePauseBtn" class="btn btn-secondary" disabled>Pause on this site</button>
      </div>
      <button type="button" id="globalPauseBtn" class="btn btn-secondary" disabled>Pause everywhere</button>
      <div id="comfortControls" class="field" hidden><label for="readingComfortInput">Reading comfort</label><select id="readingComfortInput" disabled><option value="soft">On</option><option value="off">Off</option></select></div>
      <p id="uploadError" role="alert" hidden></p>
      <p id="saveStatus" role="status" aria-label="Save status"></p>
    </section>
    <div class="section toolbar-source">
      <img id="wallpaperPreview" hidden alt="Selected wallpaper">
      <div class="file-name" id="fileNameDisplay" role="status" aria-label="Wallpaper source">No wallpaper selected</div>
    </div>
    <button type="button" id="manageWallpaperBtn" class="btn btn-primary">Choose wallpaper</button>
  </main>
  <script type="module" src="src/popup/toolbar.ts"></script>
</body>
</html>
